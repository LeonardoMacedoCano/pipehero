services:
  pipehero:
    container_name: PipeHero
    build:
      context: ${PIPEHERO_SOURCE_PATH:-.}
    environment:
      - PORT=${PORT:-5511}
      - SONGS_DIR=/songs
      - DATABASE_URL=${DATABASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - ${MUSIC_PATH:-${PIPEHERO_SOURCE_PATH:-.}/songs}:/songs
    ports:
      - "${HOST_PORT:-5511}:${PORT:-5511}"
    restart: unless-stopped
